<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 480" width="854" height="480" font-family="Malgun Gothic, 맑은 고딕, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/></marker><clipPath id="cam"><rect x="40" y="110" width="240" height="180"/></clipPath><clipPath id="rev"><rect x="380" y="90" width="0" height="260"><animate attributeName="width" dur="13000ms" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.06154;0.58462;1" values="0;0;440;440"/></rect></clipPath></defs><rect width="854" height="480" fill="#FFFFFF"/><text x="160" y="96" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">카메라 영상</text><rect x="40" y="110" width="240" height="180" fill="#D9D2C3"/><g clip-path="url(#cam)"><path d="M160,290 L160,110" stroke="#262626" stroke-width="12"/><g><animateTransform attributeName="transform" type="translate" dur="13000ms" repeatCount="indefinite" calcMode="linear" keyTimes="0.00000;0.06154;0.58462;1.00000" values="0 120;0 120;0 280;0 280"/><rect x="40" y="-7" width="240" height="14" fill="#262626"/></g></g><rect x="40" y="230" width="240" height="60" fill="#ED7D31" fill-opacity="0.18" stroke="#ED7D31" stroke-width="2" stroke-dasharray="5 3"/><text x="160" y="312" font-size="11" font-weight="bold" fill="#ED7D31" text-anchor="middle">관심 영역 = 아래 1/3</text><text x="600" y="96" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">폭 비율 = 선의 폭 ÷ 화면 폭</text><line x1="380" y1="330" x2="820" y2="330" stroke="#000"/><line x1="380" y1="330" x2="380" y2="100" stroke="#000"/><text x="372" y="334" font-size="10" fill="#595959" text-anchor="end">0</text><text x="372" y="224" font-size="10" fill="#595959" text-anchor="end">0.5</text><text x="37