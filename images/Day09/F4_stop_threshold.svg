<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 410" width="854" height="410" font-family="Malgun Gothic, 맑은 고딕, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/></marker></defs><rect width="854" height="410" fill="#FFFFFF"/><line x1="20" y1="150" x2="560" y2="150" stroke="#7F7F7F" stroke-width="2"/><rect x="520" y="80" width="40" height="70" fill="#C55A11" stroke="#7F3F0B" stroke-width="2"/><text x="540" y="72" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">장애물</text><g><rect x="120" y="120" width="70" height="22" rx="5" fill="#5B9BD5"/><rect x="134" y="110" width="40" height="12" rx="3" fill="#9DC3E6"/><circle cx="134" cy="143" r="7" fill="#404040"/><circle cx="176" cy="143" r="7" fill="#404040"/><rect x="187" y="124" width="6" height="10" fill="#ED7D31"/></g><text x="155" y="98" font-size="11" fill="#595959" text-anchor="middle">감지 시점의 차량</text><rect x="190" y="172" width="66" height="26" fill="#5B9BD5"/><line x1="193" y1="198" x2="193" y2="252" stroke="#A6A6A6"/><text x="197" y="262" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">반응 지연 동안 주행 약 6 cm  (0.3 m/s × 0.2초)</text><rect x="256" y="172" width="55" height="26" fill="#92D050"/><line x1="259" y1="198" x2="259" y2="232" stroke="#A6A6A6"/><text x="263" y="242" font-size="12" fill="#333333" text-anchor="start">관성 밀림 약 5 cm</text><rect x="311" y="172" width="209" height="26" fill="#D9D9D9"/><line x1="314" y1="198" x2="314" y2="212" stroke="#A6A6A6"/><text x="318" y="222" font-size="12" fill="#333333" text-anchor="start">나머지 = 여유 (측정 잡음 등)</text><line x1="80" y1="300" x2="520" y2="300" stroke="#000" stroke-width="1.2"/><line x1="520" y1="300" x2="520" y2="306" stroke="#000"/><text x="520" y="320" font-size="10" fill="#595959" text-anchor="middle">0</text><line x1="410" y1="300" x2="410" y2="306" stroke="#000"/><text x="410" y="320" font-size="10" fill="#595959" text-anchor="middle">10 cm</text><line x1="300" y1="300" x2="300" y2="306" stroke="#000"/><text x="300" y="320" font-size="10" fill="#595959" text-anchor="middle">20 cm</text><line x1="190" y1="300" x2="190" y2="306" stroke="#000"/><text x="190" y="320" font-size="10" fill="#595959" text-anchor="middle">30 cm</text><line x1="80" y1="300" x2="80" y2="306" stroke="#000"/><text x="80" y="320" font-size="10" fill="#595959" text-anchor="middle">40 cm</text><text x="80" y="292" font-size="10" fill="#595959" text-anchor="start">장애물까지 거리</text><path d="M190,330 L190,338 L520,338 L520,330" fill="none" stroke="#333333"/><text x="355" y="356" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">stop_cm = 30 cm</text><line x1="585" y1="40" x2="585" y2="360" stroke="#D9D9D9"/><text x="712" y="62" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">같은 속도(0.3 m/s)에서</text><text x="712" y="80" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">반응 지연 동안 주행 거리</text><text x="605" y="110" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">초음파 경로 0.2초</text><rect x="605" y="120" width="42" height="24" fill="#5B9BD5"/><text x="655" y="137" font-size="13" font-weight="bold" fill="#333333" text-anchor="start">6 cm</text><text x="605" y="180" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">손모양 경로 0.75초</text><rect x="605" y="190" width="161" height="24" fill="#ED7D31"/><text x="774" y="207" font-size="13" font-weight="bold" fill="#333333" text-anchor="start">23 cm</text><text x="712" y="276" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">장애물 정지는 초음파 경로가 담당</text><text x="712" y="296" font-size="11" fill="#595959" text-anchor="middle">(손모양 stop은 사람의 명령으로만)</text><text x="427" y="392" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">감지 조건 = 실측 거리 &lt; stop_cm</text></svg>