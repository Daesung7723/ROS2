<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 480" width="854" height="480" font-family="Malgun Gothic, 맑은 고딕, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/></marker></defs><rect width="854" height="480" fill="#FFFFFF"/><path d="M160,215 C210,170 250,150 270,145" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><path d="M392,140 L496,140" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><path d="M560,184 L560,286" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><path d="M500,330 C410,330 350,250 335,196" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><path d="M620,155 C700,170 740,195 752,200" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><path d="M760,272 C720,320 680,330 622,330" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/><text x="212" y="160" font-size="11" fill="#595959" text-anchor="middle">go</text><text x="444" y="128" font-size="11" fill="#595959" text-anchor="middle">폭 비율 ≥ 0.6</text><text x="570" y="240" font-size="11" fill="#595959" text-anchor="start">예약 있음 · 0.5초 뒤</text><text x="290" y="300" font-size="11" fill="#595959" text-anchor="middle">회전 시간 종료</text><text x="712" y="165" font-size="11" fill="#595959" text-anchor="middle">예약 없음</text><text x="706" y="360" font-size="11" fill="#595959" text-anchor="middle">left · right · uturn</text><rect x="48" y="208" width="124" height="44" rx="22" fill="#9DC3E6"><animate attributeName="fill" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.13757" values="#1F4E79;#9DC3E6"/></rect><text x="110" y="235" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">STOP</text><rect x="268" y="118" width="124" height="44" rx="22" fill="#9DC3E6"><animate attributeName="fill" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.13757;0.62269;0.79083" values="#9DC3E6;#1F4E79;#9DC3E6;#1F4E79"/></rect><text x="330" y="145" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">FOLLOW</text><rect x="498" y="118" width="124" height="44" rx="22" fill="#9DC3E6"><animate attributeName="fill" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.62269;0.66050" values="#9DC3E6;#1F4E79;#9DC3E6"/></rect><text x="560" y="145" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">APPROACH</text><rect x="498" y="308" width="124" height="44" rx="22" fill="#9DC3E6"><animate attributeName="fill" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.66050;0.79083" values="#9DC3E6;#1F4E79;#9DC3E6"/></rect><text x="560" y="335" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">TURN</text><rect x="708" y="208" width="124" height="44" rx="22" fill="#D9D9D9"></rect><text x="770" y="235" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">WAIT</text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.30249;0.42880" values="0;1;0"/><rect x="210.1" y="82" width="239.8" height="20" rx="10" fill="#ED7D31"/><text x="330" y="96" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">장애물 정지 — /cmd_vel 0 · 상태 유지</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.50684;0.66050" values="0;1;0"/><rect x="515.4" y="82" width="89.2" height="20" rx="10" fill="#92D050"/><text x="560" y="96" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">예약: left</text></g><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">STOP — 시작 상태 · 명령 대기<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.13757" values="1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">1.11초  go → FOLLOW (라인 추종)<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.13757;0.30249" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">3.16초  장애물 → 정지(1순위 조기 종료 · 상태는 FOLLOW)<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.30249;0.42880" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">4.73초  장애물 제거 → go 없이 다시 주행<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.42880;0.50684" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">5.70초  left 수신 → 주행 중이므로 예약만<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.50684;0.62269" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">7.14초  갈림길 → APPROACH(직진)<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.62269;0.66050" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">7.61초  예약 있음 → TURN (angular.z 2.0 · 1.6초)<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.66050;0.79083" values="0;1;0"/></text><text x="427" y="412" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle" opacity="0">9.23초  회전 종료 → FOLLOW<animate attributeName="opacity" calcMode="discrete" dur="12430ms" repeatCount="indefinite" keyTimes="0.00000;0.79083" values="0;1"/></text><line x1="80" y1="440" x2="774" y2="440" stroke="#BFBFBF" stroke-width="4"/><line x1="163.46" y1="434" x2="163.46" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="317.599" y1="434" x2="317.599" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="435.647" y1="434" x2="435.647" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="508.581" y1="434" x2="508.581" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="616.854" y1="434" x2="616.854" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="652.193" y1="434" x2="652.193" y2="446" stroke="#7F7F7F" stroke-width="2"/><line x1="774" y1="434" x2="774" y2="446" stroke="#7F7F7F" stroke-width="2"/><circle cx="0" cy="440" r="7" fill="#ED7D31"><animate attributeName="cx" dur="12430ms" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.04827;0.79083;1" values="80;80;774;774"/></circle><text x="80" y="462" font-size="10" fill="#595959" text-anchor="middle">0초</text><text x="774" y="462" font-size="10" fill="#595959" text-anchor="middle">9.23초</text><text x="842" y="476" font-size="10" fill="#A6A6A6" text-anchor="end">시각 = WSL2에서 line_driver 실행 · 입력은 명령으로 발행(실습 차량 아님) · 실시간</text></svg>